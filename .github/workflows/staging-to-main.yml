name: Auto PR staging to main

on:
  push:
    branches: [staging]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update PR from staging to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if an open PR from staging → main already exists
          existing=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')

          if [ -n "$existing" ]; then
            echo "Open PR #${existing} already exists — skipping creation."
            exit 0
          fi

          # Build body with recent commits
          body=$(cat <<'BODY'
          ## Release: merge staging into main

          ### Recent commits
          BODY
          )
          commits=$(git log origin/main..staging --oneline --no-merges | head -20)
          body="${body}
          \`\`\`
          ${commits}
          \`\`\`

          _Auto-generated by CI when a PR merged into staging._"

          gh pr create \
            --base main \
            --head staging \
            --title "Release: merge staging into main" \
            --body "$body"
